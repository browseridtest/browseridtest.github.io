<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Browser Identity Test</title>
  <style>
    .normal-text {
      color: blue;         
            font-size: 24px;
      line-height: 1.5;
 }
  </style>

  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 10%; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.45;
      font-size: 24px;
      background: Canvas; color: CanvasText;
    }
    .card {
      background: color-mix(in oklab, Canvas, CanvasText 8%);
      border: 1px solid color-mix(in oklab, CanvasText, transparent 88%);
      border-radius: 10px;
      padding: 14px;
      margin-block: 12px;
      font-size: 20px;
      overflow: hidden;
    }
    .grid {
      display: grid; gap: 10px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 640px) {
      .grid.two { grid-template-columns: 1fr 1fr; }
    }
    dt {
      font-weight: 600;
      color: color-mix(in oklab, CanvasText, transparent 20%);
    }
    dd {
      margin: 0 0 8px 0;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      background: color-mix(in oklab, Canvas, CanvasText 6%);
      padding: 6px 8px; border-radius: 6px;
    }
    .muted { opacity: .8; font-size: .95em; }
    .row { display: contents; }
    .status { font-size: .9em; color: color-mix(in oklab, CanvasText, transparent 40%); }
    .spinner {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid color-mix(in oklab, CanvasText, transparent 85%);
      border-top-color: color-mix(in oklab, CanvasText, transparent 40%);
      animation: spin 1s linear infinite; display: inline-block; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { padding: 16px; text-align: center; font-size: .9em; color: color-mix(in oklab, CanvasText, transparent 40%); }
    code { padding: 0 4px; background: color-mix(in oklab, Canvas, CanvasText 8%); border-radius: 4px; }
  </style>

</head>
<body>

  <center>
  <h1>Browser Identity</h1>

<table style="
  border-collapse: collapse;
  width: 90%;
  font-size: 32pt;
  font-family: Calibiri, Helvetica, Arial, sans-serif;
">
  <tbody>
    <tr style="background-color: #d1dced;">
      <th style="
        width: 35%;
        padding: 10px 14px;
        text-align: left;
        border: 2px solid #ddd;
      ">
        IP Address
      </th>
      <td style="padding: 10px 14px; border: 2px solid #ddd;">
        <span id="ip4"></span>
      </td>
    </tr>

    <tr style="background-color: #ccc;">
      <th style="
        width: 35%;
        padding: 10px 14px;
        text-align: left;
        border: 2px solid #ddd;
      ">
        Time Zone
      </th>
      <td style="padding: 10px 14px; border: 2px solid #ddd;">
        <span id="tz"></span>
      </td>
    </tr>

    <tr style="background-color: #d1dced;">
      <th style="
        width: 35%;
        padding: 10px 14px;
        text-align: left;
        border: 2px solid #ddd;
      ">
        Platform
      </th>
      <td style="padding: 10px 14px; border: 2px solid #ddd;">
        <span id="platform"></span>
      </td>
    </tr>

    <tr style="background-color: #ccc;">
      <th style="
        width: 35%;
        padding: 10px 14px;
        text-align: left;
        border: 2px solid #ddd;
      ">
        User Agent
      </th>
      <td style="padding: 10px 14px; border: 2px solid #ddd;">
        <span id="ua"></span>
      </td>
    </tr>

  </tbody>
</table>
</center>

<script>
    (function() {
      // Fill browser info
      const nav = navigator || {};
      const ua = nav.userAgent || "";
      const platform = nav.userAgentData && nav.userAgentData.platform
        ? nav.userAgentData.platform
        : (nav.platform || "");
      const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";

      document.getElementById("ua").textContent = ua || "unknown";
      document.getElementById("platform").textContent = platform || "unknown";
      document.getElementById("tz").textContent = tz || "unknown";
      
      // Fetch public IPv4 and IPv6 using ipify
      async function fetchIP(url, elId) {
        const el = document.getElementById(elId);
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(res.status + " " + res.statusText);
          const data = await res.json();
          el.textContent = data.ip || "unavailable";
        } catch (err) {
          el.textContent = "unavailable (" + (err.message || "error") + ")";
        }
      }
      fetchIP("https://api.ipify.org?format=json", "ip4");
    })();
  </script>

</body>
</html>
